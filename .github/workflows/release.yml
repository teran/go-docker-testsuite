---
name: release

on:
  push:
    tags:
      - 'v*'                 # core module, e.g. v1.6.0
      - 'applications/*/v*'  # application modules, e.g. applications/redis/v1.6.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
