---
name: verify

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: articulate/actions-markdownlint@v1

  golangci-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "23.x"
      - name: Install dependencies
        run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: false
          working-directory: .

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: go mod download
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest -json ./... > govulncheck.json
          # Fail only on vulnerabilities that actually have a fix available.
          # Findings with "Fixed in: N/A" (no patched version for the affected
          # module yet, e.g. current github.com/docker/docker SDK) are reported
          # for visibility but skipped, so they don't redden CI without a remedy.
          if [ ! -s govulncheck.json ] || ! jq -s '.' govulncheck.json >/dev/null 2>&1; then
            echo "govulncheck: unexpected error (no valid JSON output)"
            exit 1
          fi
          FIXABLE=$(jq -s '
            [ .[] | select(.osv != null).osv ] as $osvs |
            [ .[] | select(.finding != null) ] as $findings |
            [ $findings[] |
              select(
                .finding as $f |
                ($osvs[] | select(.id == $f.osv)) as $osv |
                ([ $osv.affected[]? | select(.package.name == $f.trace[0].module) ] as $aff |
                  any($aff[]?.ranges[]?.events[]?; (.fixed // "") != "")
                )
              )
            ] | length
          ' govulncheck.json)
          echo "govulncheck: ${FIXABLE} fixable vulnerability(ies); findings with no fix (Fixed in: N/A) are skipped"
          if [ "${FIXABLE:-0}" -gt 0 ]; then
            echo "Fixable vulnerabilities found - run 'govulncheck ./...' for details."
            exit 1
          fi

  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: go mod download
      - id: split
        run: |
          MATRIX=$(go run ./tools/cmd/split_test_groups)
          echo "Discovered matrix:"
          echo "$MATRIX"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  tests:
    needs: discover
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    name: tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: go mod download
      - name: Run tests
        env:
          IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
        run: |
          go test -v -race -p 1 -timeout=${{ matrix.timeout_minutes }}m ${{ matrix.packages }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: go mod download
      - name: Test with the Go CLI
        run: go build ./...
